[pytest]
testpaths = tests/automation
python_files = test_*.py
addopts = -ra --html=tests/automation/reports/report.html --self-contained-html
markers =
    quick: very fast regression checks that avoid heavy seeded data
    smoke: representative LMS coverage with a small, stable subset
    ui_phase1: independent LMS UI phase-1 E2E flows safe for parallel execution
    ui_phase2: stateful LMS UI phase-2 E2E flows backed by deterministic seed data
